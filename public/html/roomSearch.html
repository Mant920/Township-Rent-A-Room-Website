<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Room Search</title>
</head>
<body>
    <div class="mainForm">
        <div class="firstDiv">
            <h4>Please indicate the following</h4>
        </div>
        <form action="" method="get">
            <div class="userInput">
                
                <div class="div-2 input common">
                    <div class="input">
                        <div><label for="township-input">Kasi Name:</label></div>
                        <div class="datalist-container">
                            <input type="text" id="township-input" list="township-options" placeholder="Select Kasi" required>
                            <datalist id="township-options"></datalist>
                        </div>
                    </div>
                    <div id="township-error" class="error"></div>
                </div>
                
                <div class="div-4 input">
                    <label for="extension">Extension:</label>
                    <input type="number" id="extension" name="number" min="1" max="100" placeholder="36" required>
                </div>
                <div class="div-3 input">
                    <div><label for="priceRange">Room Price Range:</label></div>
                    <div>
                        <select name="priceRange" id="priceRange">
                        <option value="">Select</option>
                        <option value="500-800">R500 - R800</option>
                        <option value="800-1000">R800 - R1000</option>
                        <option value="1000-1500">R1000 - R1500</option>
                        <option value="1500-2000">R1500 - R2000</option>
                        <option value="2000-2500">R2000 - R2500</option>
                        <option value="2500-3000">R2500 - R3000</option>
                        <option value="3000-3500">R3000 - R3500</option>
                        <option value="3500-4000">R3500 - R4000</option>
                        <option value="4000+">R4000+</option>
                        </select>
                    </div>
                </div>
                <div class="div-5">
                    <h4>What would you like the room to have:</h4>
                    <div class="checkboxes">
                        <div>
                        <input type="checkbox" id="prepaidMeter" name="prepaidMeter" value="prepaidMeter">
                        <label for="prepaidMeter">Prepaid Meter</label>
                        </div>
                        <div>
                            <input type="checkbox" id="tiling" name="tiling" value="tiling">
                            <label for="tiling">Tiling</label>
                        </div>
                        <div>
                            <input type="checkbox" id="bDoor" name="bDoor" value="bDoor">
                            <label for="bDoor">Burglar door</label>
                        </div>
                        <div>
                            <input type="checkbox" id="parkingSpace" name="parkingSpace" value="parkingSpace">
                            <label for="parkingSpace">Parking Space</label>
                        </div>
                    </div>
                    
                </div>
                <div>
                    <label for="other">Other:</label>
                    <input type="text" id="other" name="other" placeholder="Free wifi etc.">
                </div>
                    
                <div class="btnDiv">
                    <div><button type="button" class="back-btn"><a href="../../index.html" class="back-btn">Back</a></button></div>
                    <div><button type="button" class="userSearch"><a href="../html/searchResults.html" class="userSearch">Search</a></button></div>
                </div>
                

            </div>
        </form>
    </div>
    <script src="../dom/app.js"></script>
</body>
</html>
