services:
  db:
    image: postgres:latest
    container_name: property_postgres
    restart: always
    environment:
      POSTGRES_USER: user714
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: